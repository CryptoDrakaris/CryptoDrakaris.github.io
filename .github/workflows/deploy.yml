name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs. The build job runs npm packages,
# so it gets read access only, and the Pages rights stay with the deploy job.
permissions: {}

# one deploy at a time; queued runs replace each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings for SITE and BASE_PATH
    steps:
      # actions are pinned to commit SHAs; the comment shows the tag the SHA was taken from (2026-11-12)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test collection scripts
        run: npm test
      - name: Configure Pages
        id: pages
        # Pages must already be on: Settings -> Pages -> Source: GitHub Actions.
        # (enablement: true needs admin rights the workflow token does not have here)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build site
        # SITE and BASE_PATH feed astro.config.mjs: canonical links, sitemap and asset paths
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: No unsafe links in the build
        # token metadata is written by strangers; only https, own files and own pages may be linked
        run: |
          if grep -rIlE 'href="(javascript:|data:|vbscript:|image_data)' dist; then
            echo "unsafe href in dist (see files above)"; exit 1
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
